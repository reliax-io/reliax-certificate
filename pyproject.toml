[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "reliax-certificate"
version = "0.1.0"
description = "The Reliax certificate: envelope schema v16 with a class on every field, the canonical-JSON SHA-256 hash chain, the wording template and banned wording, the fidelity check, and the verifier (reliax verify record.json). No dependencies."
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Reliax" }]
keywords = ["conformal-prediction", "audit-trail", "hash-chain", "model-risk", "ai-governance", "certificate"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Security",
]
dependencies = []

[project.optional-dependencies]
recompute = ["reliax-core>=0.2.0"]
test = ["pytest>=8"]

[project.scripts]
reliax = "reliax_certificate.cli:main"

[project.urls]
Homepage = "https://reliax.io"
Source = "https://github.com/reliax-io/reliax-certificate"
Issues = "https://github.com/reliax-io/reliax-certificate/issues"
Core = "https://github.com/reliax-io/reliax-core"

[tool.hatch.build.targets.wheel]
packages = ["reliax_certificate"]

[tool.hatch.build.targets.sdist]
include = ["reliax_certificate", "schema", "types", "examples", "tests", "README.md", "LICENSE", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
